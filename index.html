<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Motion Illusion</title>
<meta name="description" content="ドットの動きの錯視を、速度・サイズ・間隔・色を変えながら試せるデモ。">
<meta name="theme-color" content="#e7eaee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='7' fill='%2378a8c5' stroke='%2315181d' stroke-width='2'/%3E%3Ccircle cx='22' cy='16' r='7' fill='%23ffffff' stroke='%2315181d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
    <h1 class="title">Dot Mot<span class="i-dot">i</span>on Illus<span class="i-dot">i</span>on</h1>
</header>

<main>
    <section class="app" aria-label="錯視のデモと設定">
        <div class="stage" id="stage">
            <canvas id="canvas" role="img" aria-label="2色のドットが斜めに並び、上下に動き続けるアニメーション"></canvas>
            <p class="stage-note" id="stage-note" hidden>動きを減らす設定のため、停止しています。「再生」で始められます。</p>
        </div>

        <aside class="panel" aria-label="設定">
            <div class="actions">
                <button type="button" class="btn btn-primary" id="btn-pause" aria-pressed="false">一時停止</button>
                <button type="button" class="btn" id="btn-reset">初期値に戻す</button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>

            <fieldset class="group">
                <legend>動き</legend>
                <div class="field">
                    <label for="speed">速度</label>
                    <input type="range" id="speed" data-key="speed" min="10" max="2000" step="10">
                    <output for="speed" data-out="speed"></output>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>ドット</legend>
                <div class="field">
                    <label for="size">サイズ</label>
                    <input type="range" id="size" data-key="size" min="2" max="15" step="0.5">
                    <output for="size" data-out="size"></output>
                </div>
                <div class="field">
                    <label for="gapx">横の間隔</label>
                    <input type="range" id="gapx" data-key="gapx" min="2" max="30" step="0.5">
                    <output for="gapx" data-out="gapx"></output>
                </div>
                <div class="field">
                    <label for="gapy">縦の間隔</label>
                    <input type="range" id="gapy" data-key="gapy" min="2" max="40" step="0.5">
                    <output for="gapy" data-out="gapy"></output>
                </div>
                <div class="field">
                    <label for="line">列どうしの間隔</label>
                    <input type="range" id="line" data-key="line" min="8" max="100" step="0.5">
                    <output for="line" data-out="line"></output>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>色</legend>
                <div class="colors">
                    <label class="swatch"><input type="color" id="colorA" data-key="colorA"><span>色A</span></label>
                    <label class="swatch"><input type="color" id="colorB" data-key="colorB"><span>色B</span></label>
                    <label class="swatch"><input type="color" id="colorBg" data-key="colorBg"><span>背景</span></label>
                </div>
            </fieldset>

        </aside>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
